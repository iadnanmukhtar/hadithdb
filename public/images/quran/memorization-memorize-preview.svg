<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title description">
  <title id="title">Memorize with clarity</title>
  <desc id="description">A Quran Memorize page with Arabic ayat, memorization state markers, and a page state summary.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#082e65" flood-opacity=".16"/></filter>
  </defs>
  <rect width="640" height="960" rx="34" fill="#edf5ff"/>
  <text x="42" y="66" fill="#0d6efd" font-family="system-ui,sans-serif" font-size="22" font-weight="700">MEMORIZE</text>
  <text x="42" y="112" fill="#17202b" font-family="system-ui,sans-serif" font-size="34" font-weight="750">Build your hifz, āyah by āyah</text>
  <text x="42" y="145" fill="#5d6772" font-family="system-ui,sans-serif" font-size="18">Set each memory state as your recall grows.</text>
  <g filter="url(#shadow)">
    <rect x="34" y="182" width="572" height="722" rx="25" fill="#ffffff"/>
    <rect x="34" y="182" width="572" height="62" rx="25" fill="#f8fafc"/>
    <rect x="34" y="220" width="572" height="24" fill="#f8fafc"/>
    <circle cx="70" cy="213" r="13" fill="#1376ee"/>
    <rect x="98" y="203" width="126" height="20" rx="10" fill="#dce5ef"/>
    <rect x="404" y="197" width="78" height="32" rx="8" fill="#ffffff" stroke="#77828e" stroke-width="2"/>
    <rect x="482" y="197" width="92" height="32" rx="8" fill="#1788d4"/>
    <text x="443" y="219" text-anchor="middle" fill="#5c6772" font-family="system-ui,sans-serif" font-size="14">Mushaf</text>
    <text x="528" y="219" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Memorize</text>
    <text x="66" y="290" fill="#777f88" font-family="system-ui,sans-serif" font-size="18">Page 529</text>
    <text x="568" y="290" text-anchor="end" fill="#777f88" font-family="system-ui,sans-serif" font-size="18">سُورَةُ الْقَمَرِ · 54</text>
    <g font-family="serif" font-size="31" text-anchor="end" fill="#20252a">
      <text x="561" y="352">ٱقْتَرَبَتِ ٱلسَّاعَةُ وَٱنشَقَّ ٱلْقَمَرُ</text>
      <text x="561" y="414">وَإِن يَرَوْا۟ ءَايَةً يُعْرِضُوا۟ وَيَقُولُوا۟</text>
      <text x="561" y="476">وَكَذَّبُوا۟ وَٱتَّبَعُوٓا۟ أَهْوَآءَهُمْ</text>
      <text x="561" y="538">وَلَقَدْ جَآءَهُم مِّنَ ٱلْأَنۢبَآءِ</text>
      <text x="561" y="600">حِكْمَةٌۢ بَـٰلِغَةٌۭ فَمَا تُغْنِ ٱلنُّذُرُ</text>
    </g>
    <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <circle cx="80" cy="337" r="21" fill="#fff5d9" stroke="#e3aa15" stroke-width="3"/><text x="80" y="342" fill="#8b6200">1</text>
      <circle cx="80" cy="399" r="21" fill="#fff0e8" stroke="#f06d0b" stroke-width="3"/><text x="80" y="404" fill="#a74400">2</text>
      <circle cx="80" cy="461" r="21" fill="#edf9f4" stroke="#218b62" stroke-width="3"/><text x="80" y="466" fill="#176746">3</text>
      <circle cx="80" cy="523" r="21" fill="#f3efff" stroke="#7041c9" stroke-width="3"/><text x="80" y="528" fill="#55309b">4</text>
      <circle cx="80" cy="585" r="21" fill="#fff0e8" stroke="#f06d0b" stroke-width="3"/><text x="80" y="590" fill="#a74400">5</text>
    </g>
    <line x1="64" y1="646" x2="576" y2="646" stroke="#dce2e8" stroke-width="2"/>
    <text x="66" y="687" fill="#20252a" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Page memorization</text>
    <text x="270" y="687" fill="#6d7680" font-family="system-ui,sans-serif" font-size="16">21 āyāt</text>
    <g font-family="system-ui,sans-serif" font-size="14" font-weight="700">
      <rect x="66" y="716" width="138" height="42" rx="21" fill="#fffdf6" stroke="#e7c96c" stroke-width="2"/><circle cx="84" cy="737" r="6" fill="#e3aa15"/><text x="99" y="742" fill="#3e3524">Learning</text>
      <rect x="215" y="716" width="118" height="42" rx="21" fill="#fff8f3" stroke="#efaf85" stroke-width="2"/><circle cx="233" cy="737" r="6" fill="#f06d0b"/><text x="248" y="742" fill="#3e3524">Weak</text>
      <rect x="344" y="716" width="158" height="42" rx="21" fill="#f5fbf8" stroke="#91c8b3" stroke-width="2"/><circle cx="362" cy="737" r="6" fill="#218b62"/><text x="377" y="742" fill="#253b32">Memorized</text>
      <rect x="66" y="772" width="105" height="42" rx="21" fill="#faf8ff" stroke="#b5a0e4" stroke-width="2"/><circle cx="84" cy="793" r="6" fill="#7041c9"/><text x="99" y="798" fill="#342b48">Core</text>
      <rect x="182" y="772" width="112" height="42" rx="21" fill="#fafbfc" stroke="#bcc4cc" stroke-width="2"/><circle cx="200" cy="793" r="6" fill="#77828e"/><text x="215" y="798" fill="#3d454e">Paused</text>
    </g>
    <rect x="66" y="846" width="508" height="2" fill="#e4e9ee"/>
    <circle cx="80" cy="873" r="11" fill="#1376ee"/><rect x="105" y="865" width="170" height="15" rx="7" fill="#dce5ef"/>
  </g>
</svg>
