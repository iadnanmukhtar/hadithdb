<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title description">
  <title id="title">Review with focus</title>
  <desc id="description">A focused Quran Review page with revealed preceding ayat, a concealed current ayah, and FSRS answer buttons.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102d53" flood-opacity=".16"/></filter></defs>
  <rect width="640" height="960" rx="34" fill="#eef6fb"/>
  <text x="42" y="66" fill="#1376ee" font-family="system-ui,sans-serif" font-size="22" font-weight="700">REVIEW</text>
  <text x="42" y="112" fill="#17202b" font-family="system-ui,sans-serif" font-size="34" font-weight="750">Recall before memory fades</text>
  <text x="42" y="145" fill="#5d6772" font-family="system-ui,sans-serif" font-size="18">Focused FSRS reviews keep every āyah fresh.</text>
  <g filter="url(#shadow)">
    <rect x="34" y="182" width="572" height="722" rx="25" fill="#f4f8fb"/>
    <rect x="34" y="182" width="572" height="62" rx="25" fill="#ffffff"/>
    <rect x="34" y="220" width="572" height="24" fill="#ffffff"/>
    <rect x="70" y="197" width="92" height="32" rx="8" fill="#ffffff" stroke="#77828e" stroke-width="2"/>
    <rect x="162" y="197" width="92" height="32" rx="8" fill="#1788d4"/>
    <text x="116" y="219" text-anchor="middle" fill="#5c6772" font-family="system-ui,sans-serif" font-size="14">Memorize</text>
    <text x="208" y="219" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Review</text>
    <text x="66" y="288" fill="#66727d" font-family="system-ui,sans-serif" font-size="18">Page 529</text>
    <text x="568" y="288" text-anchor="end" fill="#66727d" font-family="system-ui,sans-serif" font-size="18">سُورَةُ الْقَمَرِ · 54</text>
    <g font-family="serif" font-size="31" text-anchor="end">
      <rect x="121" y="317" width="440" height="51" rx="9" fill="#e3f1eb"/><text x="548" y="351" fill="#754018">ٱقْتَرَبَتِ ٱلسَّاعَةُ وَٱنشَقَّ ٱلْقَمَرُ</text>
      <rect x="101" y="379" width="460" height="51" rx="9" fill="#e3f1eb"/><text x="548" y="413" fill="#754018">وَإِن يَرَوْا۟ ءَايَةً يُعْرِضُوا۟ وَيَقُولُوا۟</text>
      <rect x="112" y="441" width="449" height="51" rx="9" fill="#e3f1eb"/><text x="548" y="475" fill="#754018">وَكَذَّبُوا۟ وَٱتَّبَعُوٓا۟ أَهْوَآءَهُمْ</text>
      <rect x="95" y="503" width="466" height="51" rx="9" fill="#e9eff3"/><text x="548" y="537" fill="#aeb7bf">وَلَقَدْ جَآءَهُم مِّنَ ٱلْأَنۢبَآءِ</text>
      <rect x="125" y="565" width="436" height="51" rx="9" fill="#edf2f5"/><text x="548" y="599" fill="#c3cbd1">حِكْمَةٌۢ بَـٰلِغَةٌۭ فَمَا تُغْنِ ٱلنُّذُرُ</text>
    </g>
    <circle cx="78" cy="528" r="24" fill="#eaf3ff" stroke="#1376ee" stroke-width="3"/><text x="78" y="534" text-anchor="middle" fill="#1376ee" font-family="system-ui,sans-serif" font-size="14" font-weight="700">4</text>
    <rect x="70" y="631" width="500" height="64" rx="15" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
    <circle cx="101" cy="663" r="17" fill="#1376ee"/><text x="128" y="657" fill="#20262c" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Recall Quran 54:4</text><text x="128" y="680" fill="#78828c" font-family="system-ui,sans-serif" font-size="13">Reveal the āyah, then grade your recall.</text>
    <line x1="66" y1="731" x2="574" y2="731" stroke="#d5dde5" stroke-width="2"/>
    <text x="66" y="768" fill="#252b31" font-family="system-ui,sans-serif" font-size="18" font-weight="700">How well did you remember?</text>
    <g font-family="Georgia,serif" font-size="15" font-weight="700" text-anchor="middle">
      <rect x="66" y="791" width="92" height="46" rx="9" fill="#c71f35"/><text x="112" y="820" fill="#ffffff">Again</text>
      <rect x="168" y="791" width="92" height="46" rx="9" fill="#ed5a16"/><text x="214" y="820" fill="#ffffff">Hard</text>
      <rect x="270" y="791" width="92" height="46" rx="9" fill="#1376ee"/><text x="316" y="820" fill="#ffffff">Good</text>
      <rect x="372" y="791" width="92" height="46" rx="9" fill="#218b62"/><text x="418" y="820" fill="#ffffff">Easy</text>
      <rect x="474" y="791" width="92" height="46" rx="9" fill="#707a84"/><text x="520" y="820" fill="#ffffff">Skip</text>
    </g>
    <rect x="66" y="860" width="128" height="25" rx="12" fill="#dce8f7"/><rect x="204" y="860" width="82" height="25" rx="12" fill="#e3e8ed"/>
  </g>
</svg>
