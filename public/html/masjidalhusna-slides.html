<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","@id":"https://hadithunlocked.com/html/masjidalhusna-slides.html","name":"Masjid al-Husna announcements","description":"View the announcement slideshow for Masjid al-Husna.","url":"https://hadithunlocked.com/html/masjidalhusna-slides.html"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
<script src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
<style>
  * {
    box-sizing: border-box;
  }
  
  body {
    font-family: var(--ux-font-ui);
  }
  
  .carousel {
    background: #fafaf9;
  }
  
  .carousel-cell {
    margin-right: 20px;
    overflow: hidden;
  }
  
  .carousel-cell img {
    display: block;
    height: 200px;
  }
  
  @media screen and (min-width: 768px) {
    .carousel-cell img {
      height: 400px;
    }
  }
</style>

</head>
<body>
<main aria-label="Masjid al-Husna announcements"><div id="ss" class="carousel"></div></main>

<script>
  var carousel = document.querySelector('.carousel');
  var flkty = new Flickity(carousel, {
    imagesLoaded: true,
    percentPosition: false,
  });
  
  var apiURL = '/api/proxy/https%3A%2F%2Fmasjidal.com%2Fapi%2Fv2%2Fmasjids%2F5AvPx2KX%3Fdate_end%3D2024-06-21%26date_start%3D2024-06-11%26expand%3Dslideshow%2Cannouncements';
  fetch(apiURL)
    .then(response => response.json())
    .then(masjidal => {
      createCarousel(masjidal);
    })
    .catch(error => console.error('Error fetching images:', error));
  
  function createCarousel(masjidal) {
    var images = masjidal.slideshow.images;
    images.forEach(image => {
      const img = document.createElement('img');
      img.setAttribute('class', 'carousel-cell-image');
      img.alt = image.name || 'Masjid announcement';
      img.setAttribute('src', image.url);
      img.addEventListener('load', () => {
        const div = document.createElement('div');
        div.setAttribute('class', 'carousel-cell');
        const a = document.createElement('a');
        a.setAttribute('href', image.img_click_url);
        a.setAttribute('target', '_blank');
        a.setAttribute('title', image.name);
        a.appendChild(img);
        div.appendChild(a);
        flkty.append(div);
      });
    });
    flkty.on('scroll', () => {
      flkty.slides.forEach(slide => {
        const img = slide.cells[0]?.element.querySelector('img');
        if (img) img.style.transform = `translateX(${-(slide.target + flkty.x) / 3}px)`;
      });
    });
  }
</script>
</body>
</html>
