<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>We'll be right back | Hadith Unlocked</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #2c9be5;
      --accent-dark: #2379b1;
      --ink: #111111;
      --muted: #606060;
      --paper: #ffffff;
      --wash: #f7f9fb;
      --line: rgba(17, 17, 17, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(44, 155, 229, 0.10), transparent 44%),
        var(--wash);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 58px);
      text-align: center;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(17, 17, 17, 0.10);
    }

    .logo {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 12px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.15rem);
      font-weight: 500;
      line-height: 1.08;
    }

    p {
      max-width: 460px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .retry {
      margin-top: 30px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    button {
      margin-top: 18px;
      padding: 11px 22px;
      color: #fff;
      background: var(--accent-dark);
      border: 1px solid var(--accent-dark);
      border-radius: 999px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: var(--accent); border-color: var(--accent); }
    button:focus-visible { outline: 3px solid rgba(44, 155, 229, 0.34); outline-offset: 3px; }

    noscript p { font-size: 0.9rem; }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/static/img/logo2.svg" width="72" height="72" alt="Hadith Unlocked">
    <p class="eyebrow">Service temporarily unavailable</p>
    <h1>We’ll be right back</h1>
    <p>The site is restarting to apply an update. This usually takes only a few moments.</p>
    <div class="retry" role="status" aria-live="polite">
      Retrying in <span id="retry-seconds">30</span> seconds…
    </div>
    <button type="button" id="retry-now">Try again now</button>
    <noscript><p>Please refresh this page in a few moments.</p></noscript>
  </main>

  <script>
    (function () {
      var remaining = 30;
      var seconds = document.getElementById('retry-seconds');
      var retry = function () { window.location.reload(); };

      document.getElementById('retry-now').addEventListener('click', retry);
      window.setInterval(function () {
        remaining -= 1;
        seconds.textContent = String(Math.max(remaining, 0));
        if (remaining <= 0)
          retry();
      }, 1000);
    }());
  </script>
</body>
</html>
